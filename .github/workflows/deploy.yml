name: Deploy GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Insert GitHub Secrets into JS files
        shell: bash
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          ACHIEVEMENTS_API_URL: ${{ secrets.ACHIEVEMENTS_API_URL }}
          LILANEI_AI_ENDPOINT: ${{ secrets.LILANEI_AI_ENDPOINT }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          values = {
              "__TWITCH_CLIENT_ID__": os.environ.get("TWITCH_CLIENT_ID", ""),
              "__ACHIEVEMENTS_API_URL__": os.environ.get("ACHIEVEMENTS_API_URL", ""),
              "__LILANEI_AI_ENDPOINT__": os.environ.get("LILANEI_AI_ENDPOINT", ""),
          }

          missing = [k for k, v in values.items() if not v]
          if missing:
              raise SystemExit("Missing GitHub Secrets for: " + ", ".join(missing))

          for filename in ["script.js", "romance.js"]:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")

              for placeholder, value in values.items():
                  text = text.replace(placeholder, value)

              path.write_text(text, encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
