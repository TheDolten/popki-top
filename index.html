<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🫦 Статистика кусей</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="badge">Twitch chat stats</div>
      <h1>🫦 Статистика кусей</h1>
      <p id="source">Загрузка данных...</p>
      <p class="hint">Главная страница показывает все команды <b>!кусь</b> из <code>data/kus_site_data.json</code></p>
    </header>

    <section class="stats">
      <div class="stat"><b id="total">0</b><span>всего кусей</span></div>
      <div class="stat"><b id="groups">0</b><span>типов кусей</span></div>
      <div class="stat"><b id="leaders">0</b><span>кого выбирало</span></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>🏆 Кого чаще выбирало</h2>
        <input id="search" placeholder="поиск по нику, команде или кусю..." />
      </div>
      <div id="top" class="top-list"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>📚 Все куси</h2>
        <select id="sort">
          <option value="count">По количеству</option>
          <option value="name">По названию</option>
          <option value="chosen">По топ выбранным</option>
        </select>
      </div>
      <div id="kusi" class="grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
